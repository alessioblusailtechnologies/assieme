# Blueprint Render di VELIA, ramo develop: ambiente DEV (api-dev / app-dev.sonovelia.it).
# Su main gli stessi servizi puntano a api. / app.sonovelia.it.
#
# Un'immagine sola (be-node/Dockerfile) per API e worker, regione Francoforte (UE),
# più il sito statico dell'app Angular. La sandbox dell'Esportazione elaborata
# sta su Fly.io (DEPLOY.md §2b) ed è condivisa fra dev e prod.
#
# Render → New → Blueprint → questo repo: legge questo file e crea i servizi.
# I segreti (sync: false) li chiede una volta nel pannello; il resto è qui.
services:
  # --- API: HTTP pubblico, health check su /api/salute ---------------------
  - type: web
    name: velia-api
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: be-node
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/src/api/server.js
    healthCheckPath: /api/salute
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LIVELLO
        value: info
      - key: CORS_ORIGINI
        value: https://app-dev.sonovelia.it
      - key: MODELLO_MOTORE
        value: claude-opus-5
      - key: SUPABASE_URL
        value: https://hcxiloivukbdcfcugksg.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HOSTYOURAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false

  # --- Worker: nessuna porta, disco per la cache delle workspace -----------
  - type: worker
    name: velia-worker
    runtime: docker
    region: frankfurt
    plan: standard
    rootDir: be-node
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/src/worker/main.js
    autoDeploy: true
    disk:
      name: velia-worker-cache
      mountPath: /app/.velia-worker
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LIVELLO
        value: info
      - key: MODELLO_MOTORE
        value: claude-opus-5
      - key: CARTELLA_WORKER
        value: /app/.velia-worker
      - key: SUPABASE_URL
        value: https://hcxiloivukbdcfcugksg.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HOSTYOURAI_API_KEY
        sync: false
      # Generazione documenti da template: il runner della sandbox è il servizio
      # privato velia-sandbox qui sotto (DEPLOY.md §2b), raggiunto sulla rete
      # privata di Render col segreto condiviso.
      - key: SANDBOX_AVVIATORE
        value: render
      - key: SANDBOX_URL
        fromService:
          name: velia-sandbox
          type: pserv
          property: hostport
      - key: SANDBOX_TOKEN
        fromService:
          name: velia-sandbox
          type: pserv
          envVarKey: SANDBOX_TOKEN

  # --- Sandbox documentale: il runner sempre acceso, un job per volta -------
  # Stessa immagine della sandbox (LibreOffice, Chromium, Python, Claude Code),
  # senza namespace di rete (Render non dà NET_ADMIN): SANDBOX_RETE=aperta.
  # Nessun database né Storage qui: solo la workspace del job corrente.
  - type: pserv
    name: velia-sandbox
    runtime: docker
    region: frankfurt
    plan: pro
    rootDir: be-node/sandbox
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: SANDBOX_RETE
        value: aperta
      - key: SANDBOX_TOKEN
        generateValue: true
      # La chiave che entra nel proxy del runner: dedicata, con tetto di spesa.
      - key: ANTHROPIC_API_KEY
        sync: false

  # --- App Angular: sito statico, routing della SPA con la rewrite ---------
  - type: web
    name: velia-app
    runtime: static
    rootDir: fe-angular
    # config.js si scrive al build dalla variabile: stesso codice, API diversa per ambiente
    # (prod: api.sonovelia.it; dev, dal ramo develop: api-dev.sonovelia.it).
    buildCommand: npm ci && npx ng build && printf "window.veliaApiBase = '%s';\n" "$VELIA_API_BASE" > dist/fe-angular/browser/config.js
    staticPublishPath: dist/fe-angular/browser
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VELIA_API_BASE
        value: https://api-dev.sonovelia.it/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
