<div class="marchio">
  <a class="marchio__link" routerLink="/chat" aria-label="Assieme — vai alla chat">
    <!--
      Il segno è un SVG e non una lettera in una scatola CSS.
      Centrare otticamente una maiuscola con `place-items: center` non
      funziona: la riga di testo riserva spazio ai discendenti che la "A" non
      usa, e la lettera risulta alta di un paio di pixel. `dominant-baseline`
      centra sul glifo, non sulla riga, e il risultato non dipende dalle
      metriche del font.
    -->
    <svg class="marchio__segno" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
      <rect width="28" height="28" fill="var(--c-accent)" />
      <text
        x="14"
        y="14"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="Newsreader, Georgia, serif"
        font-size="18"
        fill="#ffffff"
      >
        A
      </text>
    </svg>

    @if (!compressa()) {
      <span class="marchio__nome serif">Assieme</span>
    }
  </a>
</div>

<nav class="nav" aria-label="Navigazione principale">
  @for (gruppo of gruppi(); track gruppo.etichetta) {
    <div class="nav__gruppo">
      @if (!compressa()) {
        <p class="mono nav__titolo">{{ gruppo.etichetta }}</p>
      }

      <ul>
        @for (voce of gruppo.voci; track voce.percorso) {
          <li>
            <a
              class="nav__voce"
              [routerLink]="voce.percorso"
              routerLinkActive="is-attiva"
              [routerLinkActiveOptions]="{ exact: voce.percorso === '/archivio/privato' }"
              [title]="compressa() ? voce.etichetta : ''"
            >
              <ui-icon [name]="voce.icona" [size]="18" />
              @if (!compressa()) {
                <span class="nav__etichetta">{{ voce.etichetta }}</span>
              }
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>

<button
  type="button"
  class="comprimi"
  (click)="compressa.set(!compressa())"
  [attr.aria-label]="compressa() ? 'Espandi la barra laterale' : 'Comprimi la barra laterale'"
  [attr.aria-expanded]="!compressa()"
>
  <ui-icon name="comprimi-barra" [size]="16" />
  @if (!compressa()) {
    <span>Comprimi</span>
  }
</button>
