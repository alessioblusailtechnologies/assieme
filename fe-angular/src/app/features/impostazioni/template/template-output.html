<header class="testata">
  <h1 class="serif testata__titolo">Template di output</h1>
</header>

<div class="schede" role="tablist" aria-label="Intestazione e modelli">
  <button
    type="button"
    role="tab"
    id="scheda-intestazione"
    class="scheda"
    aria-controls="pannello-intestazione"
    [class.is-attiva]="scheda() === 'intestazione'"
    [attr.aria-selected]="scheda() === 'intestazione'"
    (click)="cambiaScheda('intestazione')"
  >
    Intestazione e piè di pagina
  </button>
  <button
    type="button"
    role="tab"
    id="scheda-modelli"
    class="scheda"
    aria-controls="pannello-modelli"
    [class.is-attiva]="scheda() === 'modelli'"
    [attr.aria-selected]="scheda() === 'modelli'"
    (click)="cambiaScheda('modelli')"
  >
    Modelli di riferimento
  </button>
</div>

@if (scheda() === 'intestazione') {
  <app-scheda-intestazione
    id="pannello-intestazione"
    role="tabpanel"
    aria-labelledby="scheda-intestazione"
  />
} @else {
  <app-scheda-modelli id="pannello-modelli" role="tabpanel" aria-labelledby="scheda-modelli" />
}
