<div class="composer">
  @if (selettoreAperto()) {
    <ui-selettore-documenti
      class="selettore"
      [query]="menzione()?.query ?? ''"
      [esclusi]="esclusi()"
      (scelto)="referenzia($event)"
      (chiuso)="chiudiSelettore()"
    />
  }

  <div class="campo">
    <input
      #file
      type="file"
      multiple
      hidden
      (change)="allegaFile($event)"
      aria-hidden="true"
      tabindex="-1"
    />

    <!--
      L'editor: testo e, tra le parole, i chip dei documenti referenziati e
      degli allegati. Il contenuto lo governa il componente (editor-testo.ts),
      non il template: qui solo il contenitore e i suoi eventi.

      Sta in cima e prende tutta la larghezza: il testo comincia dove comincia
      il riquadro. Le azioni stanno sotto, su una riga loro - e per chi arriva
      da tastiera il campo viene prima dei pulsanti, che è l'ordine in cui si
      usa il composer.
    -->
    <div
      #area
      class="campo__testo"
      contenteditable="true"
      spellcheck="true"
      aria-label="Messaggio"
      aria-multiline="true"
      data-placeholder="Fai una domanda sui documenti - «@» per referenziarli"
      (input)="aggiorna()"
      (keydown)="suTasto($event)"
      (keyup)="aggiornaCursore()"
      (click)="aggiornaCursore()"
      (paste)="incolla($event)"
      (drop)="$event.preventDefault()"
    ></div>

    <div class="campo__azioni">
      <button
        type="button"
        class="campo__allega"
        (click)="file.click()"
        aria-label="Allega un file alla conversazione"
        title="Allega un file - resta in questa conversazione, non entra negli archivi"
      >
        <ui-icon name="allega" [size]="17" />
      </button>
      <button
        type="button"
        class="campo__allega"
        (click)="apriDaPulsante()"
        aria-label="Referenzia un documento degli archivi"
        title="Referenzia un documento (@)"
      >
        <ui-icon name="referenzia" [size]="17" />
      </button>

      <!--
        «Scrivi il prompt»: due parole buttate giù diventano una richiesta
        completa, coi documenti del contesto nominati. Il testo si sostituisce
        nel campo, e finché non lo si tocca si può tornare al proprio.
      -->
      @if (store.promptRipristinabile()) {
        <button
          type="button"
          class="campo__allega"
          (click)="ripristina()"
          aria-label="Ripristina il testo che avevi scritto"
          title="Ripristina il tuo testo"
        >
          <ui-icon name="riprova" [size]="17" />
        </button>
      } @else {
        <button
          type="button"
          class="campo__allega"
          [class.is-attivo]="store.promptInScrittura()"
          (click)="scriviPrompt()"
          [disabled]="store.promptInScrittura() || store.inRisposta()"
          aria-label="Scrivi il prompt a partire dal testo"
          title="Scrivi il prompt: Velia riscrive il tuo testo come una richiesta completa, da rileggere prima di inviare"
        >
          <ui-icon [name]="store.promptInScrittura() ? 'in-corso' : 'bacchetta'" [size]="17" />
        </button>
      }

      <!-- A destra, attaccato a Invia, il microfono: si parla e si manda. -->
      <span class="campo__strumenti">
        <!--
          La dettatura: un clic apre il microfono (il pulsante si accende e
          pulsa), il clic dopo lo chiude e il parlato arriva nel campo come
          testo. Se il browser non sa registrare, il pulsante non c'è.
        -->
        @if (microfonoDisponibile) {
          <button
            type="button"
            class="campo__allega campo__microfono"
            [class.is-registrazione]="inRegistrazione()"
            (click)="dettatura()"
            [disabled]="store.trascrizioneInCorso()"
            [attr.aria-pressed]="inRegistrazione()"
            [attr.aria-label]="inRegistrazione() ? 'Ferma la dettatura' : 'Detta il messaggio'"
            [title]="inRegistrazione() ? 'Ferma la dettatura' : store.trascrizioneInCorso() ? 'Trascrivo…' : 'Detta il messaggio'"
          >
            <ui-icon [name]="store.trascrizioneInCorso() ? 'in-corso' : inRegistrazione() ? 'ferma' : 'microfono'" [size]="17" />
          </button>
        }
      </span>

      @if (store.inRisposta()) {
        <button
          type="button"
          class="campo__invia is-ferma"
          (click)="store.ferma()"
          aria-label="Ferma la risposta"
          title="Ferma la risposta"
        >
          <ui-icon name="ferma" [size]="16" />
        </button>
      } @else {
        <button
          type="button"
          class="campo__invia"
          (click)="invia()"
          [disabled]="!store.bozza().trim()"
          aria-label="Invia il messaggio"
          title="Invia (Invio)"
        >
          <ui-icon name="invia" [size]="16" />
        </button>
      }
    </div>
  </div>
</div>
