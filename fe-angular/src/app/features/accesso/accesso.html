<main class="accesso">
  <!-- Il cielo: il grafo della memoria viva, grande, che deriva lentamente
       dietro la scheda. Due movimenti sovrapposti: i nodi respirano dentro
       il canvas, e l'intera figura si sposta con una deriva di 80 secondi. -->
  <div class="accesso__grafo" aria-hidden="true">
    <app-grafo-memoria />
  </div>

  <p class="accesso__marchio">VELIA</p>

  <div class="accesso__voce" aria-hidden="true">
    <p class="accesso__claim">La memoria viva della tua agenzia.</p>
    <p class="accesso__sotto-claim">
      Documenti, regole e casistica risolta: tutto ciò che l’agenzia sa, in un posto che non
      dimentica.
    </p>
  </div>

  <!-- La porta: una scheda sola, al centro della scena. -->
  <section class="accesso__scheda" aria-labelledby="titolo-accesso">
    <h1 id="titolo-accesso" class="accesso__titolo">Accedi</h1>
    <p class="accesso__sottotitolo">Entra con le credenziali della tua agenzia.</p>

    <form class="accesso__form" (ngSubmit)="invia()">
      <label class="accesso__etichetta" for="email">Email</label>
      <input
        uiCampo
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />

      <label class="accesso__etichetta" for="password">Password</label>
      <input
        uiCampo
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
      />

      @if (errore(); as messaggio) {
        <p class="accesso__errore" role="alert">{{ messaggio }}</p>
      }

      <button uiBottone variante="primario" type="submit" [disabled]="inCorso()">
        @if (inCorso()) {
          Accesso in corso…
        } @else {
          Entra
        }
      </button>
    </form>
  </section>
</main>
