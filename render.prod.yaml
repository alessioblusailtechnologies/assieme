# Blueprint Render di VELIA, PRODUZIONE: api.sonovelia.it / app.sonovelia.it, ramo main.
#
# Il gemello di render.yaml (l'ambiente dev, ramo develop): stessi servizi,
# stessa immagine, valori di produzione. Due file e non uno perché a ogni
# sync il Blueprint riscrive le variabili che hanno `value:`: un indirizzo
# corretto a mano nel pannello tornerebbe quello del file, e i link ai
# clienti finirebbero sull'ambiente di prova senza che nessuno se ne accorga.
#
# Render → New → Blueprint → questo repo, ramo main, Blueprint Path
# `render.prod.yaml`. I nomi hanno il suffisso -prod: con gli stessi nomi del
# dev il Blueprint si aggancerebbe ai servizi dell'ambiente di prova.
#
# Le variabili `sync: false` Render le chiede solo alla creazione, e dopo non
# le tocca più. Quelle facoltative non sono qui e si aggiungono dal pannello
# (la sync conserva le variabili che il file non dichiara):
#   - SUPABASE_JWT_SECRET, solo se il progetto usa le chiavi JWT legacy HS256;
#     senza, l'API verifica i token col JWKS del progetto;
#   - DEEPSEEK_API_KEY (livello Avanzato): server in Cina, i documenti escono
#     dall'UE. In produzione è una scelta, non un default;
#   - HOSTYOURAI_API_KEY, AKI_API_KEY.
#
# Supabase è un progetto suo, non quello di dev: DEPLOY.md §4.
services:
  # --- API: HTTP pubblico, health check su /api/salute ---------------------
  - type: web
    name: velia-api-prod
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    rootDir: be-node
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/src/api/server.js
    healthCheckPath: /api/salute
    autoDeployTrigger: commit
    domains:
      - api.sonovelia.it
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LIVELLO
        value: info
      - key: CORS_ORIGINI
        value: https://app.sonovelia.it
      # I link delle chat cliente, `<radice>/c/<token>`: il default del codice
      # è l'ambiente dev.
      - key: BASE_LINK_CHAT
        value: https://app.sonovelia.it
      # Le pagine condivise, `<radice>/p/<token>`: le serve questo servizio.
      - key: BASE_LINK_PAGINE
        value: https://api.sonovelia.it
      - key: MODELLO_MOTORE
        value: claude-opus-5
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Pooler in modalità sessione, porta 5432, utente velia_app.<ref>.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # «Invia email»: senza, in produzione l'invio risponde 503.
      - key: RESEND_API_KEY
        sync: false
      # La dettatura nel composer.
      - key: MISTRAL_API_KEY
        sync: false

  # --- Worker: nessuna porta, disco per la cache delle workspace -----------
  - type: worker
    name: velia-worker-prod
    runtime: docker
    region: frankfurt
    plan: standard
    branch: main
    rootDir: be-node
    dockerfilePath: ./Dockerfile
    dockerCommand: node dist/src/worker/main.js
    autoDeployTrigger: commit
    disk:
      name: velia-worker-cache-prod
      mountPath: /app/.velia-worker
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LIVELLO
        value: info
      - key: MODELLO_MOTORE
        value: claude-opus-5
      # Il link che lo strumento `condividi_link` del motore scrive in chat.
      - key: BASE_LINK_PAGINE
        value: https://api.sonovelia.it
      - key: CARTELLA_WORKER
        value: /app/.velia-worker
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Il testimone OCR dell'ingestion visiva: senza, il controllo resta al
      # solo layer di testo del PDF, che sulle scansioni è cieco.
      - key: MISTRAL_API_KEY
        sync: false
      # Le email degli agenti (14/09/2026): le spedisce il worker, verso i
      # destinatari del piano confermato. Senza, l'invio si rifiuta.
      - key: RESEND_API_KEY
        sync: false
      - key: SANDBOX_AVVIATORE
        value: render
      - key: SANDBOX_URL
        fromService:
          name: velia-sandbox-prod
          type: pserv
          property: hostport
      - key: SANDBOX_TOKEN
        fromService:
          name: velia-sandbox-prod
          type: pserv
          envVarKey: SANDBOX_TOKEN

  # --- Sandbox documentale: il runner sempre acceso, un job per volta -------
  - type: pserv
    name: velia-sandbox-prod
    runtime: docker
    region: frankfurt
    plan: pro
    branch: main
    rootDir: be-node/sandbox
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: SANDBOX_RETE
        value: aperta
      - key: SANDBOX_TOKEN
        generateValue: true
      # Dedicata, in un workspace Anthropic suo, con tetto di spesa mensile.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Dal 21/09/2026 anche DeepSeek: col livello «Avanzato» i documenti li
      # scrive lui. Senza, la sandbox ripiega sul modello di piattaforma.
      - key: DEEPSEEK_API_KEY
        sync: false

  # --- App Angular: sito statico, routing della SPA con la rewrite ---------
  - type: web
    name: velia-app-prod
    runtime: static
    branch: main
    rootDir: fe-angular
    buildCommand: npm ci && npx ng build && printf "window.veliaApiBase = '%s';\n" "$VELIA_API_BASE" > dist/fe-angular/browser/config.js
    staticPublishPath: dist/fe-angular/browser
    autoDeployTrigger: commit
    domains:
      - app.sonovelia.it
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VELIA_API_BASE
        value: https://api.sonovelia.it/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
